# IC9 + IU validation against a filtered subset of validation_params-sf3.csv:
# 500 IC9 ops + the 8087 IU1-IU8 ops that precede them in time order.
# Verifies (a) IC9 read correctness vs Neo4j-reference and
# (b) IU1/IU6/IU7 maintenance keeps PersonSide and MessageByCreator
# consistent with what IC9 expects on subsequent reads.
mode=validate_database
name=LDBC-SNB
thread_count=1
operation_count=20000
validate_database=/Users/waleed/repositories/ldbc_snb_interactive_v1_impls/age/datasets/validation_params-sf3-ic9+ius-window2k.csv

