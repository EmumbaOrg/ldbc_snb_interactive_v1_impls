database=org.ldbcouncil.snb.impls.workloads.age.interactive.AgeInteractiveDb
workload=org.ldbcouncil.snb.driver.workloads.interactive.LdbcSnbInteractiveWorkload

# Apache AGE / Horizon DB connection
age_endpoint=localhost:5432/postgres
age_user=postgres
age_password=postgres
age_graph_name=ldbc_snb

age_connection_pool_size=4
age_connection_timeout_ms=30000
age_keepalive_ms=30000
age_max_lifetime_ms=1800000

queryDir=queries

# IC5-focused validation against truncated IU+IC5 CSV (built 2026-05-13 to
# isolate IC5 from attribution-heuristic noise; all 6,818 IC5 ops + 8,087 IUs
# in original time order, other reads stripped).
mode=validate_database
name=LDBC-SNB
thread_count=1
operation_count=20000
validate_database=/Users/waleed/repositories/ldbc_snb_interactive_v1_impls/age/datasets/validation_params-sf3-iu+ic5.csv

status=5
time_unit=MILLISECONDS
time_compression_ratio=0.001
ignore_scheduled_start_times=true
spinner_wait_duration=0
peer_identifiers=
workload_statistics=false
help=false

ldbc.snb.interactive.parameters_dir=/Users/waleed/repositories/ldbc_snb_interactive_v1_impls/age/datasets/substitution_parameters-sf3/
ldbc.snb.interactive.updates_dir=/Users/waleed/repositories/ldbc_snb_interactive_v1_impls/age/datasets/social_network-sf3-CsvComposite-LongDateFormatter/
ldbc.snb.interactive.short_read_dissipation=0.2
ldbc.snb.interactive.scale_factor=3

# All complex reads disabled EXCEPT IC5 (the focus of this run).
ldbc.snb.interactive.LdbcQuery1_enable=false
ldbc.snb.interactive.LdbcQuery2_enable=false
ldbc.snb.interactive.LdbcQuery3_enable=false
ldbc.snb.interactive.LdbcQuery4_enable=false
ldbc.snb.interactive.LdbcQuery5_enable=true
ldbc.snb.interactive.LdbcQuery6_enable=false
ldbc.snb.interactive.LdbcQuery7_enable=false
ldbc.snb.interactive.LdbcQuery8_enable=false
ldbc.snb.interactive.LdbcQuery9_enable=false
ldbc.snb.interactive.LdbcQuery10_enable=false
ldbc.snb.interactive.LdbcQuery11_enable=false
ldbc.snb.interactive.LdbcQuery12_enable=false
ldbc.snb.interactive.LdbcQuery13_enable=false
ldbc.snb.interactive.LdbcQuery14_enable=false

# All short reads disabled — focused CSV doesn't contain them anyway.
ldbc.snb.interactive.LdbcShortQuery1PersonProfile_enable=false
ldbc.snb.interactive.LdbcShortQuery2PersonPosts_enable=false
ldbc.snb.interactive.LdbcShortQuery3PersonFriends_enable=false
ldbc.snb.interactive.LdbcShortQuery4MessageContent_enable=false
ldbc.snb.interactive.LdbcShortQuery5MessageCreator_enable=false
ldbc.snb.interactive.LdbcShortQuery6MessageForum_enable=false
ldbc.snb.interactive.LdbcShortQuery7MessageReplies_enable=false

# All IUs enabled — they're the state drivers for IC5's expected outputs.
ldbc.snb.interactive.LdbcUpdate1AddPerson_enable=true
ldbc.snb.interactive.LdbcUpdate2AddPostLike_enable=true
ldbc.snb.interactive.LdbcUpdate3AddCommentLike_enable=true
ldbc.snb.interactive.LdbcUpdate4AddForum_enable=true
ldbc.snb.interactive.LdbcUpdate5AddForumMembership_enable=true
ldbc.snb.interactive.LdbcUpdate6AddPost_enable=true
ldbc.snb.interactive.LdbcUpdate7AddComment_enable=true
ldbc.snb.interactive.LdbcUpdate8AddFriendship_enable=true

printQueryNames=false
printQueryStrings=false
printQueryResults=false

# IC5 is excluded from parameterized list (mixes outer SQL $minDate with cypher() $personId).
age_parameterized_queries=Update2AddPostLike,Update3AddCommentLike,Update8AddFriendship
