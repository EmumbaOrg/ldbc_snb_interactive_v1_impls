database=org.ldbcouncil.snb.impls.workloads.age.interactive.AgeInteractiveDb
workload=org.ldbcouncil.snb.driver.workloads.interactive.LdbcSnbInteractiveWorkload

# Apache AGE / Horizon DB connection
age_endpoint=<HORIZON_HOST>:<HORIZON_PORT>/<HORIZON_DB>
age_user=<user>
age_password=<password>
age_graph_name=ldbc_snb

# JDBC pool sizing — see comment in benchmark.properties.
# Keep equal to thread_count.
age_connection_pool_size=4
age_connection_timeout_ms=30000
age_keepalive_ms=30000
age_max_lifetime_ms=1800000

# Query files directory
queryDir=queries

# Validation mode
mode=validate_database
name=LDBC-SNB
thread_count=4
operation_count=10000
validate_database=/tmp/ldbc_sf100/validation_params-sf100.csv

# Driver tuning
status=1
time_unit=MILLISECONDS
time_compression_ratio=0.001
ignore_scheduled_start_times=true
spinner_wait_duration=0
peer_identifiers=
workload_statistics=false
help=false

# LDBC workload parameters
# parameters_dir must point at the directory that directly contains interactive_*_param.txt
# (NOT a wrapping dir if your archive nests it under substitution_parameters-sf{N}/).
ldbc.snb.interactive.parameters_dir=/tmp/ldbc_sf100/substitution_parameters-sf100/
ldbc.snb.interactive.updates_dir=/tmp/ldbc_sf100/social_network-sf100-CsvComposite-LongDateFormatter/
ldbc.snb.interactive.short_read_dissipation=0.2
# Supported scale factors are 0.1, 0.3, 1, 3, 10, 30, 100, 300, 1000
ldbc.snb.interactive.scale_factor=100

ldbc.snb.interactive.LdbcQuery1_enable=true
ldbc.snb.interactive.LdbcQuery2_enable=true
ldbc.snb.interactive.LdbcQuery3_enable=true
ldbc.snb.interactive.LdbcQuery4_enable=true
ldbc.snb.interactive.LdbcQuery5_enable=false
ldbc.snb.interactive.LdbcQuery6_enable=true
ldbc.snb.interactive.LdbcQuery7_enable=true
ldbc.snb.interactive.LdbcQuery8_enable=true
ldbc.snb.interactive.LdbcQuery9_enable=false
ldbc.snb.interactive.LdbcQuery10_enable=true
ldbc.snb.interactive.LdbcQuery11_enable=true
ldbc.snb.interactive.LdbcQuery12_enable=true
ldbc.snb.interactive.LdbcQuery13_enable=false
ldbc.snb.interactive.LdbcQuery14_enable=false

ldbc.snb.interactive.LdbcShortQuery1PersonProfile_enable=true
ldbc.snb.interactive.LdbcShortQuery2PersonPosts_enable=true
ldbc.snb.interactive.LdbcShortQuery3PersonFriends_enable=true
ldbc.snb.interactive.LdbcShortQuery4MessageContent_enable=true
ldbc.snb.interactive.LdbcShortQuery5MessageCreator_enable=true
ldbc.snb.interactive.LdbcShortQuery6MessageForum_enable=false
ldbc.snb.interactive.LdbcShortQuery7MessageReplies_enable=true

ldbc.snb.interactive.LdbcUpdate1AddPerson_enable=true
ldbc.snb.interactive.LdbcUpdate2AddPostLike_enable=true
ldbc.snb.interactive.LdbcUpdate3AddCommentLike_enable=true
ldbc.snb.interactive.LdbcUpdate4AddForum_enable=true
ldbc.snb.interactive.LdbcUpdate5AddForumMembership_enable=true
ldbc.snb.interactive.LdbcUpdate6AddPost_enable=true
ldbc.snb.interactive.LdbcUpdate7AddComment_enable=true
ldbc.snb.interactive.LdbcUpdate8AddFriendship_enable=true

printQueryNames=false
printQueryStrings=false
printQueryResults=false

# Parameterized cypher() queries (plan caching via pgjdbc PreparedStatement)
# IC3 excluded: outer-SQL $countryXName/$countryYName references (see §11 of query-run-perf-improvement-plan.md).
# IC10 migrated in Phase F (precomputed birthMonth/birthDay on Person nodes).
# Query9 excluded: rewritten as pure SQL date-driven semi-join, no cypher() call to inject `?` agtype params into.
# Query5 excluded: outer-SQL $minDate reference in the HAS_MEMBER join condition. The parameterized template path leaves $minDate literal; only cypher()-internal params get bound via the agtype blob.
# Update5AddForumMembership excluded (Phase 3B, 2026-05-13): IU5 is now hybrid — Cypher CREATE + outer-SQL UPDATE that populates the new HAS_MEMBER.join_date BIGINT denorm column. The outer UPDATE references $forumId/$personId/$joinDate which the parameterized template path can't bind.
# ShortQuery6MessageForum excluded (2026-05-13): IS6's CommentRootPost-driven rewrite uses LATERAL cypher() with agtype_build_map(rootPostId, …) as the third arg — that variant doesn't end in `$$)` so the prepareTemplate `?`-injection adds fewer placeholders than countCypherCalls expects (3 cypher() calls, 2 placeholders).
# ShortQuery4MessageContent EXCLUDED 2026-05-15: single-node MATCH (m:Comment|Post {id:$messageId}) can't bind the agtype runtime param to the GIN index. Cached generic plan falls back to Seq Scan on the 6.4M-row Comment table → p50 4.7s in SF3 benchmark. The non-parameterized path string-substitutes the literal so the planner picks the GIN bitmap scan (~5-15ms).
# Person-anchored queries (SQ1/SQ3, Q2/Q4/Q7/Q10/Q11/Q12) EXCLUDED 2026-05-15: same root cause as SQ4 but smaller blast radius. Generic plan picks Seq Scan on Person (24K rows at SF3 → ~170ms baseline; 10M rows projected at SF1000 → ~70s). Non-parameterized path string-substitutes the literal and the planner uses gin_person.
# Q6 EXCLUDED 2026-05-15: same root cause, Tag table (16K rows). Generic plan Seq Scan = 24ms per call; non-parameterized literal path uses gin_tag = 1ms per call. Tag is a fixed-size vocabulary so the absolute number won't grow at SF1000 (still ~16K), but the 23ms-per-call tax is unnecessary.
# SQ5/SQ7/IU2/IU3/IU8 EXCLUDED 2026-05-15: empirically benched PREPARE/EXECUTE — the cached parameterized path doesn't save time because PostgreSQL re-plans every call (sticks with custom plan over generic for these shapes), AND the parameterized path adds an agtype_access_operator($1, '"key"') extraction at execution time that the literal path skips. Net: non-parameterized is ~0.5–1ms faster per call across all measured queries, even for the multi-anchor IU writes. Empty list → AgeListOperationHandler always goes through the string-substituted Statement.execute() path. Also eliminates the AGE-QUIRKS §13 trap entirely (no countCypherCalls miscounting).
age_parameterized_queries=
